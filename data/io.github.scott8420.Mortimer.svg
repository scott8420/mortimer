<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Mortimer's app icon: a window whose body is laid brickwork - the form
       built from parts, held together by the mortar between them. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e5c64"/>
      <stop offset="1" stop-color="#3d3846"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e66100"/>
      <stop offset="1" stop-color="#c64600"/>
    </linearGradient>
    <clipPath id="body"><rect x="14" y="38" width="100" height="74" rx="4"/></clipPath>
  </defs>
  <rect x="8" y="12" width="112" height="106" rx="14" fill="url(#frame)"/>
  <circle cx="24" cy="25" r="4" fill="#ffffff" fill-opacity="0.35"/>
  <circle cx="37" cy="25" r="4" fill="#ffffff" fill-opacity="0.35"/>
  <circle cx="50" cy="25" r="4" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="14" y="38" width="100" height="74" rx="4" fill="#deddda"/>
  <g clip-path="url(#body)" fill="url(#brick)">
    <rect x="16"  y="40" width="46" height="21" rx="3"/>
    <rect x="66"  y="40" width="46" height="21" rx="3"/>
    <rect x="-8"  y="65" width="46" height="21" rx="3"/>
    <rect x="42"  y="65" width="46" height="21" rx="3"/>
    <rect x="92"  y="65" width="46" height="21" rx="3"/>
    <rect x="16"  y="90" width="46" height="21" rx="3"/>
    <rect x="66"  y="90" width="46" height="21" rx="3"/>
  </g>
</svg>
